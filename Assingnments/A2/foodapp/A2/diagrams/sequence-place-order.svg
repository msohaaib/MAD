<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620">
  <rect width="920" height="620" fill="#F4EFE6"/>
  <text x="460" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2A1C16">Sequence: Customer places an order</text>
  <line x1="160" y1="90" x2="160" y2="580" stroke="#C4A46A" stroke-dasharray="4 6"/>
  <line x1="460" y1="90" x2="460" y2="580" stroke="#C4A46A" stroke-dasharray="4 6"/>
  <line x1="760" y1="90" x2="760" y2="580" stroke="#C4A46A" stroke-dasharray="4 6"/>
  <rect x="80" y="58" width="160" height="36" rx="8" fill="#7A2E24"/>
  <text x="160" y="82" text-anchor="middle" fill="#fff" font-family="Helvetica" font-size="14">App</text>
  <rect x="380" y="58" width="160" height="36" rx="8" fill="#7A2E24"/>
  <text x="460" y="82" text-anchor="middle" fill="#fff" font-family="Helvetica" font-size="14">Express Server</text>
  <rect x="680" y="58" width="160" height="36" rx="8" fill="#7A2E24"/>
  <text x="760" y="82" text-anchor="middle" fill="#fff" font-family="Helvetica" font-size="14">MongoDB</text>

  <line x1="160" y1="140" x2="460" y2="140" stroke="#2A1C16" marker-end="url(#arrow)"/>
  <text x="310" y="132" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#2A1C16">POST /api/orders { items[] }</text>

  <line x1="460" y1="190" x2="760" y2="190" stroke="#2A1C16" marker-end="url(#arrow)"/>
  <text x="610" y="182" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#2A1C16">find MenuItems by id</text>

  <line x1="760" y1="240" x2="460" y2="240" stroke="#2A1C16" marker-end="url(#arrow)"/>
  <text x="610" y="232" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#2A1C16">name, price, available</text>

  <line x1="460" y1="300" x2="460" y2="340" stroke="#7A2E24"/>
  <rect x="390" y="292" width="140" height="56" rx="6" fill="#FFFCF6" stroke="#C4A46A"/>
  <text x="460" y="316" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#2A1C16">Reject unavailable</text>
  <text x="460" y="334" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#2A1C16">Compute total in DB</text>

  <line x1="460" y1="400" x2="760" y2="400" stroke="#2A1C16" marker-end="url(#arrow)"/>
  <text x="610" y="392" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#2A1C16">insert Order</text>

  <line x1="760" y1="450" x2="460" y2="450" stroke="#2A1C16" marker-end="url(#arrow)"/>
  <text x="610" y="442" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#2A1C16">saved order + timestamps</text>

  <line x1="460" y1="520" x2="160" y2="520" stroke="#2A1C16" marker-end="url(#arrow)"/>
  <text x="310" y="512" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#2A1C16">201 Created { order }</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-max">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A1C16"/>
    </marker>
  </defs>
</svg>
